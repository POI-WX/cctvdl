name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Build each platform's installers and stash them as workflow artifacts.
  build:
    name: Build (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2022
            arch: x64
            extension: exe
            script: dist:win
          - platform: macOS
            os: macos-15-intel
            arch: x64
            extension: dmg
            script: dist:mac
          - platform: macOS
            os: macos-15
            arch: arm64
            extension: dmg
            script: dist:mac
          - platform: Linux
            os: ubuntu-22.04
            arch: x64
            extension: AppImage
            script: dist:linux
          - platform: Linux
            os: ubuntu-22.04-arm
            arch: arm64
            extension: AppImage
            script: dist:linux
    steps:
      - uses: actions/checkout@v4

      # electron-builder names artifacts from package.json's version, not the tag.
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No auto-update: publish:null + nsis.differentialPackage:false (in
      # electron-builder.yml) stop latest*.yml / *.blockmap from being generated
      # at all. --publish never is just belt-and-suspenders. macOS builds use an
      # ad-hoc signature (identity: "-") — no Apple cert, but a self-consistent
      # bundle so Gatekeeper won't report "damaged".
      - run: npm run ${{ matrix.script }} -- --${{ matrix.arch }} --publish never

      - name: Verify packaged application and bundled runtime
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "Linux" ]; then
            xvfb-run --auto-servernum node scripts/verify-packaged-app.mjs "${{ matrix.platform }}" "${{ matrix.arch }}"
          else
            node scripts/verify-packaged-app.mjs "${{ matrix.platform }}" "${{ matrix.arch }}"
          fi

      # electron-builder uses the Linux convention "x86_64" for AppImage;
      # public package names consistently use "x64" on all three platforms.
      - name: Normalize Linux x64 artifact name
        if: matrix.platform == 'Linux' && matrix.arch == 'x64'
        shell: bash
        run: |
          shopt -s nullglob
          for file in dist-electron/*x86_64.AppImage; do
            mv "$file" "${file/x86_64/x64}"
          done

      - name: Verify installer name
        shell: bash
        run: |
          count="$(find dist-electron -maxdepth 1 -type f -name "* ${{ matrix.arch }}.${{ matrix.extension }}" | wc -l | tr -d ' ')"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one ${{ matrix.platform }} ${{ matrix.arch }} installer"
            find dist-electron -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
          if-no-files-found: error

  # A single job creates ONE draft Release and uploads every installer to it.
  # Splitting build from publish guarantees a single draft (no matrix race).
  release:
    name: Publish draft Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
